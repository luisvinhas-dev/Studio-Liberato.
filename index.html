    <meta name="description"
        content="Studio Liberato - Academia, musculação, personal trainer e treinamento.">

   <title>Studio Liberato</title>

    <link rel="icon" type="image/png" href="imagens/logo.png">
</head>

<body>
 <nav id="inicio" class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
    <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand" href="#inicio">
            <img src="imagens/logo.png" width="150" alt="Studio Liberato">
        </a>

        <!-- Botão Hambúrguer (aparece só em telas menores que md) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" 
        aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Área que recolhe no celular -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav mx-auto text-center gap-2 gap-md-4">
                <li class="nav-item">
                    <a class="nav-link" href="#sobre">Sobre Nós</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#servicos">Serviços</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#Equipe">Equipe</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#Faleconosco">Fale Conosco</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#Criadores">Criadores</a>
                </li>
            </ul>
        </div>

    </div>
</nav>
<center>
<div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
  <div class="carousel-inner" >
    <div class="carousel-item active">
      <img src="imagens/carousel 1.png"  class="d-block w-100" alt="Studio Liberato">
    </div>
    <div class="carousel-item">
      <img src="imagens/carousel 2.png" class="d-block w-100" alt="Studio Liberato">
    </div>
    <div class="carousel-item">
      <img src="imagens/carousel 3.png" class="d-block w-100" alt="Studio Liberato">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
</center>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
